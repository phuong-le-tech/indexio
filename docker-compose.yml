services:
  postgres:
    image: postgres:17
    # Disposable local credentials, not suitable for a hosted database.
    environment:
      POSTGRES_USER: indexio
      POSTGRES_PASSWORD: indexio-local-only
      POSTGRES_DB: indexio
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indexio -d indexio"]
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  postgres_data:
