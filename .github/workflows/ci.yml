name: CI

on:
  push:
    branches: [main, feat/t_5ed302ee-local-readiness]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: indexio
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: indexio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U indexio -d indexio_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://indexio:ci-only-password@127.0.0.1:5432/indexio_test
      APP_PASSWORD: ci-only-app-password
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      COOKIE_SECURE: "false"
      ALLOW_PRIVATE_URLS: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run migrate
      - run: npm run build
